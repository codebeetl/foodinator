{% extends "base.html" %}

{% block title %}Settings - Foodinator{% endblock %}

{% block content %}
<h2>Settings</h2>
<form class="card" method="post" action="/settings">
    <label>Default start time
        <input type="time" name="default_start_time" value="{{ settings.default_start_time }}" required>
    </label>
    <label>Default duration (minutes)
        <input type="number" name="default_duration_minutes" min="1" value="{{ settings.default_duration_minutes }}" required>
    </label>
    <label>Week starts on
        <select name="week_start_weekday" required>
            <option value="0" {% if settings.week_start_weekday == 0 %}selected{% endif %}>Monday</option>
            <option value="1" {% if settings.week_start_weekday == 1 %}selected{% endif %}>Tuesday</option>
            <option value="2" {% if settings.week_start_weekday == 2 %}selected{% endif %}>Wednesday</option>
            <option value="3" {% if settings.week_start_weekday == 3 %}selected{% endif %}>Thursday</option>
            <option value="4" {% if settings.week_start_weekday == 4 %}selected{% endif %}>Friday</option>
            <option value="5" {% if settings.week_start_weekday == 5 %}selected{% endif %}>Saturday</option>
            <option value="6" {% if settings.week_start_weekday == 6 %}selected{% endif %}>Sunday</option>
        </select>
    </label>
    <label>Theme
        <select name="theme" required>
            <option value="auto" {% if settings.theme == "auto" %}selected{% endif %}>Auto (match device)</option>
            <option value="light" {% if settings.theme == "light" %}selected{% endif %}>Light</option>
            <option value="dark" {% if settings.theme == "dark" %}selected{% endif %}>Dark</option>
        </select>
    </label>
    <button type="submit">Save</button>
</form>
<p class="app-version">Foodinator v{{ app_version }}</p>
{% endblock %}
