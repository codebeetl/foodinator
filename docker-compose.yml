services:
  app:
    image: ghcr.io/codebeetl/foodinator:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://foodinator:foodinator@foodinator-db:5432/foodinator
      HA_URL: ${HA_URL}
      HA_TOKEN: ${HA_TOKEN}
      HA_CALENDAR_ENTITY_ID: ${HA_CALENDAR_ENTITY_ID}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      APP_TZ: ${APP_TZ}
      DISPLAY_TOKEN: ${DISPLAY_TOKEN}
      GCAL_CLIENT_ID: ${GCAL_CLIENT_ID}
      GCAL_CLIENT_SECRET: ${GCAL_CLIENT_SECRET}
      GCAL_REDIRECT_URI: ${GCAL_REDIRECT_URI}
      RUST_LOG: info
    depends_on:
      foodinator-db:
        condition: service_healthy

  foodinator-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: foodinator
      POSTGRES_PASSWORD: foodinator
      POSTGRES_DB: foodinator
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodinator"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db-data:
